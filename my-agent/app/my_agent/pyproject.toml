[project]
name = "my-agent"
version = "0.1.0"
description = "Customer support agent on Amazon Bedrock AgentCore (Strands + Nova Micro)"
requires-python = ">=3.10"
dependencies = [
    "strands-agents",
    "bedrock-agentcore",
    "boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_agent"]
